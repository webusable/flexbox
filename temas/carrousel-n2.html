<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrusel de imágenes con CSS3</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #090d16;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      color: #fff;
    }

    /* Contenedor principal semántico article */
    article.carousel-container {
      position: relative;
      width: 100%;
      max-width: 850px;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    /* Título h3 */
    article.carousel-container h3 {
      font-size: 1.25rem;
      color: #38bdf8;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Ocultar las radios de control */
    article.carousel-container input[type="radio"] {
      display: none;
    }

    /* Marco del viewport */
    .carousel-viewport {
      position: relative;
      width: 100%;
      height: 420px;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid #334155;
    }

    /* Pista deslizante UL */
    ul.carousel-track {
      display: flex;
      width: 500%;
      height: 100%;
      list-style: none;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    ul.carousel-track li.slide {
      width: 20%;
      height: 100%;
    }

    ul.carousel-track figure {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
    }

    /* Imágenes integradas en figure::before */
    ul.carousel-track figure::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      z-index: 1;
    }

    ul.carousel-track li:nth-child(1) figure::before {
      background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1200');
    }

    ul.carousel-track li:nth-child(2) figure::before {
      background-image: url('https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?w=1200');
    }

    ul.carousel-track li:nth-child(3) figure::before {
      background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1200');
    }

    ul.carousel-track li:nth-child(4) figure::before {
      background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1200');
    }

    ul.carousel-track li:nth-child(5) figure::before {
      background-image: url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1200');
    }

    /* Leyenda figcaption */
    ul.carousel-track figcaption {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 16px 24px;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.95), transparent);
      color: #ffffff;
      font-weight: 600;
    }

    /* Desplazamiento mediante CSS3 transform */
    #slide1:checked~.carousel-viewport ul.carousel-track {
      transform: translateX(0%);
    }

    #slide2:checked~.carousel-viewport ul.carousel-track {
      transform: translateX(-20%);
    }

    #slide3:checked~.carousel-viewport ul.carousel-track {
      transform: translateX(-40%);
    }

    #slide4:checked~.carousel-viewport ul.carousel-track {
      transform: translateX(-60%);
    }

    #slide5:checked~.carousel-viewport ul.carousel-track {
      transform: translateX(-80%);
    }

    /* Navegación de Puntos: NAV > UL > LI */
    nav.carousel-dots-nav {
      margin-top: 18px;
    }

    nav.carousel-dots-nav ul.carousel-dots-list {
      display: flex;
      justify-content: center;
      gap: 10px;
      list-style: none;
    }

    nav.carousel-dots-nav ul.carousel-dots-list li label {
      display: block;
      width: 12px;
      height: 12px;
      background-color: #475569;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.3s;
    }

    #slide1:checked~nav.carousel-dots-nav ul li label[for="slide1"],
    #slide2:checked~nav.carousel-dots-nav ul li label[for="slide2"],
    #slide3:checked~nav.carousel-dots-nav ul li label[for="slide3"],
    #slide4:checked~nav.carousel-dots-nav ul li label[for="slide4"],
    #slide5:checked~nav.carousel-dots-nav ul li label[for="slide5"] {
      background-color: #38bdf8;
      width: 36px;
    }

    /* Navegación de Flechas: NAV > UL > LI */
    nav.carousel-arrows-nav ul.carousel-arrows-list {
      list-style: none;
    }

    nav.carousel-arrows-nav ul.carousel-arrows-list li.arrow-group {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      pointer-events: none;
      z-index: 10;
    }

    nav.carousel-arrows-nav ul.carousel-arrows-list li.arrow-group label {
      pointer-events: auto;
      width: 44px;
      height: 44px;
      background-color: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #slide1:checked~.carousel-viewport nav.carousel-arrows-nav ul li.arrow-1,
    #slide2:checked~.carousel-viewport nav.carousel-arrows-nav ul li.arrow-2,
    #slide3:checked~.carousel-viewport nav.carousel-arrows-nav ul li.arrow-3,
    #slide4:checked~.carousel-viewport nav.carousel-arrows-nav ul li.arrow-4,
    #slide5:checked~.carousel-viewport nav.carousel-arrows-nav ul li.arrow-5 {
      display: flex;
    }
  </style>
</head>

<body>

  <!-- Estructura Semántica HTML5 -->
  <article class="carousel-container">
    <h3>Carrusel de imágenes con CSS3</h3>

    <input type="radio" name="carousel" id="slide1" checked>
    <input type="radio" name="carousel" id="slide2">
    <input type="radio" name="carousel" id="slide3">
    <input type="radio" name="carousel" id="slide4">
    <input type="radio" name="carousel" id="slide5">

    <section class="carousel-viewport">
      <ul class="carousel-track">
        <li class="slide">
          <figure>
            <figcaption>Foto 1</figcaption>
          </figure>
        </li>
        <li class="slide">
          <figure>
            <figcaption>Foto 2</figcaption>
          </figure>
        </li>
        <li class="slide">
          <figure>
            <figcaption>Foto 3</figcaption>
          </figure>
        </li>
        <li class="slide">
          <figure>
            <figcaption>Foto 4</figcaption>
          </figure>
        </li>
        <li class="slide">
          <figure>
            <figcaption>Foto 5</figcaption>
          </figure>
        </li>
      </ul>

      <nav class="carousel-arrows-nav">
        <ul class="carousel-arrows-list">
          <li class="arrow-group arrow-1"><label for="slide5">&lt;</label><label for="slide2">&gt;</label></li>
          <li class="arrow-group arrow-2"><label for="slide1">&lt;</label><label for="slide3">&gt;</label></li>
          <li class="arrow-group arrow-3"><label for="slide2">&lt;</label><label for="slide4">&gt;</label></li>
          <li class="arrow-group arrow-4"><label for="slide3">&lt;</label><label for="slide5">&gt;</label></li>
          <li class="arrow-group arrow-5"><label for="slide4">&lt;</label><label for="slide1">&gt;</label></li>
        </ul>
      </nav>
    </section>

    <nav class="carousel-dots-nav">
      <ul class="carousel-dots-list">
        <li><label for="slide1"></label></li>
        <li><label for="slide2"></label></li>
        <li><label for="slide3"></label></li>
        <li><label for="slide4"></label></li>
        <li><label for="slide5"></label></li>
      </ul>
    </nav>
  </article>

</body>

</html>
